    <script>
      // ==========================================================
      // BUSCADOR SILENCIOSO CON HUECO FIJO (JUEGO PRINCIPAL)
      // ==========================================================
      (function () {
        var TIEMPO_REINTENTO = 10000;
        var TIEMPO_ESPERA_EXITO = 3000;
        var adTimeout;
        var adEncontrado = false;

        function aplicarEstilos() {
          var adContainer = document.getElementById("game-inline-ad");
          if (adContainer) {
            adContainer.style.setProperty("height", "120px", "important");
            adContainer.style.setProperty("min-height", "120px", "important");
            adContainer.style.setProperty(
              "margin",
              "25px auto 15px auto",
              "important",
            );
            adContainer.style.setProperty("overflow", "hidden", "important");
            adContainer.style.setProperty(
              "transition",
              "opacity 0.5s ease",
              "important",
            );
          }
        }

        function setVisible(esVisible) {
          var adContainer = document.getElementById("game-inline-ad");
          if (adContainer) {
            if (esVisible) {
              adContainer.style.setProperty("opacity", "1", "important");
              adContainer.style.setProperty(
                "pointer-events",
                "auto",
                "important",
              );
            } else {
              adContainer.style.setProperty("opacity", "0", "important");
              adContainer.style.setProperty(
                "pointer-events",
                "none",
                "important",
              );
            }
          }
        }

        function probarAdSense() {
          if (adEncontrado) return;
          var adIframe = document.getElementById("iframe-adsense-inline");
          if (adIframe) {
            setVisible(false);
            adIframe.src = adIframe.src;

            clearTimeout(adTimeout);
            adTimeout = setTimeout(function () {
              if (!adEncontrado) {
                adEncontrado = true;
                setVisible(true);
              }
            }, TIEMPO_ESPERA_EXITO);
          }
        }

        window.addEventListener("message", function (event) {
          if (event.data === "adsenseFallo") {
            clearTimeout(adTimeout);
            adEncontrado = false;
            setVisible(false);
            setTimeout(probarAdSense, TIEMPO_REINTENTO);
          }
        });

        // Aseguramos que se inicie tras renderizar React
        var initCheck = setInterval(function () {
          if (document.getElementById("game-inline-ad")) {
            clearInterval(initCheck);
            aplicarEstilos();
            adTimeout = setTimeout(function () {
              if (!adEncontrado) {
                adEncontrado = true;
                setVisible(true);
              }
            }, TIEMPO_ESPERA_EXITO);
          }
        }, 500);
      })();
    </script>
